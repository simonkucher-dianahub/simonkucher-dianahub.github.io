name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

env:
  GITLAB_REPO: git.simon-kucher.com/latam-python-club-committee/dianahub.git

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror GitHub to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # Strip stray whitespace/newlines picked up when pasting the secret
          GITLAB_TOKEN="$(printf '%s' "$GITLAB_TOKEN" | tr -d '[:space:]')"

          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi

          url="https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}"

          if ! git ls-remote "$url" > /dev/null; then
            # Diagnostics only: token type prefix and length, never the token itself
            echo "Token prefix: ${GITLAB_TOKEN:0:6}  length: ${#GITLAB_TOKEN}"
            echo "Runner IP: $(curl -s https://api.ipify.org)"
            curl -s -w '\nHTTP %{http_code}\n' -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              "https://${GITLAB_REPO%%/*}/api/v4/personal_access_tokens/self" || true
            echo "::error::Cannot access https://${GITLAB_REPO}. Check the project path and that the token has write_repository scope and Maintainer role."
            exit 1
          fi

          # Turn every remote-tracking branch into a local ref, then push
          # only branches and tags (refs/pull/* etc. are rejected by GitLab).
          git fetch --prune --tags origin '+refs/heads/*:refs/heads/*' --update-head-ok
          git push --force --prune "$url" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
