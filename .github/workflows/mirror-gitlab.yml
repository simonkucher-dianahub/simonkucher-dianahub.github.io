name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

env:
  GITLAB_REPO: gitlab.com/latam-python-club-committee/dianahub.git

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror GitHub to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi

          url="https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}"

          if ! git ls-remote "$url" > /dev/null; then
            echo "::error::Cannot access https://${GITLAB_REPO}. Check the project path and that the token has write_repository scope and Maintainer role."
            exit 1
          fi

          # Turn every remote-tracking branch into a local ref, then push
          # only branches and tags (refs/pull/* etc. are rejected by GitLab).
          git fetch --prune --tags origin '+refs/heads/*:refs/heads/*' --update-head-ok
          git push --force --prune "$url" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
