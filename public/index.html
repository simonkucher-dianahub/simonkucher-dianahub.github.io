<body>
  <div class="hero">
    <svg class="hero-diamonds" viewBox="0 0 1300 600" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
      <path
        d="M237.5 425L362.5 550L237.5 675L112.5 550Z M487.5 425L612.5 550L487.5 675L362.5 550Z M737.5 400L862.5 525L737.5 650L612.5 525Z M862.5 275L987.5 400L862.5 525L737.5 400Z M1112.5 275L1237.5 400L1112.5 525L987.5 400Z M987.5 150L1112.5 275L987.5 400L862.5 275Z M1237.5 400L1362.5 525L1237.5 650L1112.5 525Z" />
    </svg>

    <header class="navbar">
      <div class="container navbar-inner">
        <a class="navbar-brand" href="index.html">
          <img src="assets/dianahub_logo.png" alt="DianaHub">
        </a>

        <nav class="navbar-links">
          <a href="index.html" aria-current="page">Tools</a>
          <a href="about.html">About Diana</a>
          <a class="navbar-cta" href="help.html">Need help?</a>
        </nav>
      </div>
    </header>

    <main class="container hero-content">
      <h1>Tools by Digital Analytics LATAM</h1>

      <a class="btn-primary" href="about.html">
        Learn more
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 10h13M11 5l5 5-5 5" />
        </svg>
      </a>
    </main>
  </div>

  <section class="tools">
    <div class="container tools-search">
      <label class="visually-hidden" for="tool-search">Search tools</label>
      <div class="tools-search-field">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5" />
          <path d="M13 13l4 4" />
        </svg>
        <input id="tool-search" type="search" placeholder="Search tools, sectors…" autocomplete="off">
      </div>
    </div>

    <div class="container tools-grid">
      <article class="tool-card">
        <img class="tool-icon" src="assets/icons/factorstrat.png" alt="">
        <h2>FactorStrat</h2>
        <p class="tool-desc">Find the drivers behind change in revenue or margin.</p>
        <div class="tool-card-actions">
          <a class="btn-primary" href="#">Install</a>
          <a class="btn-secondary" href="#">Tutorial</a>
        </div>
      </article>

      <article class="tool-card">
        <img class="tool-icon" src="assets/icons/compol.svg" alt="">
        <h2>Compol</h2>
        <p class="tool-desc">Coming to you soon.</p>
        <div class="tool-card-actions">
          <a class="btn-primary is-disabled" aria-disabled="true">Install</a>
          <a class="btn-secondary is-disabled" aria-disabled="true">Tutorial</a>
        </div>
      </article>
    </div>

    <p class="container tools-empty" hidden>No tools match your search.</p>
  </section>

  <footer>
    <div class="container">
      <p>
        <a href="about.html">About Diana</a> |
        <a href="https://gitlab.com/pages/plain-html/">Downloads</a> |
        <a href="help.html">Need help?</a>
      </p>
    </div>
  </footer>

  <script>
    (function () {
      var input = document.getElementById("tool-search");
      var cards = document.querySelectorAll(".tool-card");
      var empty = document.querySelector(".tools-empty");

      input.addEventListener("input", function () {
        var query = input.value.trim().toLowerCase();
        var visible = 0;

        cards.forEach(function (card) {
          var match = card.textContent.toLowerCase().indexOf(query) !== -1;
          card.hidden = !match;
          if (match) visible++;
        });

        empty.hidden = visible > 0;
      });
    })();
  </script>
</body>

</html>
